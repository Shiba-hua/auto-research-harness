# ══════════════════════════════════════════════════════════════════════
# auto-research-harness · on-server profile patch
# 见 docs/07-技术方案.md、docs/08-验收与交付计划.md、docs/09-研究员推理栈方案.md
# ══════════════════════════════════════════════════════════════════════

# ── 本地推理平面：两个端点、两个模型 ─────────────────────────────────
# 值班员在小端点常驻（CPU），研究员在大端点按需（GPU）。两者都是 OpenAI 兼容。
- id: llm-pi-ai
  config:
    providers:
      guard:
        displayName: 值班员 · MiniCPM5-2B（CPU 常驻）
        api: openai-completions
        baseURL: http://127.0.0.1:18099/v1
        # 本地端点不校验 key，但 pi-ai 要求这个引用存在。
        # dsh-credentials 的解析分层覆盖「进程环境变量」，空值视为缺席，
        # 缺席时报 "No API key for provider: guard"。真实值由 dsh-run 注入。
        apiKeyEnv: LOCAL_LLM_KEY
        # 思考由「请求状态」驱动 —— 可在 UI 里切档，不再写死。
        #
        # 关键：chatTemplateKwargs 是 compat 的字段，不是 provider 的顶层字段。
        # 早先写在顶层时 dsh-llm-pi-ai 根本不读它（也因此绕过了 index.js:685
        # 的 "no model on the route speaks it" 校验），属静默失效：
        # llama.cpp 的 chat template 默认开着思考，于是每轮白烧 ~40 token。
        # 实测判据（同一问题、同一模型）：
        #   不传 chat_template_kwargs → 43 token、reasoning_content 60 字符
        #   传 enable_thinking=false  →  2 token、无 reasoning_content
        #
        # thinkingFormat 必须是 chat-template 系，pi-ai 才会把 $var 解析为
        # chat_template_kwargs.enable_thinking 布尔值（dist/api/openai-completions.js:798）。
        compat:
          thinkingFormat: chat-template
          chatTemplateKwargs:
            enable_thinking:
              $var: thinking.enabled
              # llama.cpp 默认开思考，所以"关"必须显式发 false，不能靠省略。
              omitWhenOff: false
          # 值班员的模板只有 enable_thinking 布尔，但 llama.cpp 支持按请求传
          # 思考 token 预算 —— 实测 thinking_budget_tokens=8 能把 reasoning
          # 从 389 字符压到 11，所以档位是真的，不是只有开关。
          supportsThinkingTokenBudget: true
          thinkingTokenBudgetField: thinking_budget_tokens
        # 各档的思考预算（token）。-1 = 不限制（llama.cpp 语义）。
        thinkingBudgets:
          minimal: 32
          low: 128
          medium: 512
          high: -1
        defaultContextWindow: 131072
        defaultMaxTokens: 4096
        models:
          - id: minicpm5-2b
            name: MiniCPM5-2B IQ4_XS（值班员，CPU 常驻 :18099）
            contextWindow: 131072
            # 可调档位 —— 声明后 UI 会给出选择器。
            # off  -> enable_thinking=false（模板会写 <think></think> 空思考）
            # 其余 -> enable_thinking=true，并用 thinkingBudgets 给预算上限
            # 实测：值班员关思考确实更笨，所以默认建议 medium 以上。
            reasoningEfforts:
              off:
              minimal: minimal
              low: low
              medium: medium
              high: high
      researcher:
        displayName: 研究员 · Qwen3.8-27B-AWQ（GPU 按需）
        api: openai-completions
        baseURL: http://127.0.0.1:18001/v1
        apiKeyEnv: LOCAL_LLM_KEY
        # 研究员的模板支持 enable_thinking + reasoning_effort
        # （合法值 xhigh / medium / low，模型默认 xhigh）。
        compat:
          thinkingFormat: chat-template
          chatTemplateKwargs:
            enable_thinking:
              $var: thinking.enabled
              omitWhenOff: false
            reasoning_effort:
              $var: thinking.effort
        defaultContextWindow: 262144
        defaultMaxTokens: 8192
        models:
          - id: qwen3-8-27b
            name: Qwen3.8-27B-AWQ（研究员，GPU 按需 :18001）
            contextWindow: 262144
            # 模板的 reasoning_effort 只认这三个值（外加 off=关思考）。
            # 注：这是「思考努力档」，不是 token 预算 —— Qwen 模板没有预算变量，
            # 所以不要在 provider 层配 thinkingBudgets（会被校验拒绝或静默无效）。
            reasoningEfforts:
              off:
              low: low
              medium: medium
              xhigh: xhigh

# ── 顶层会话模型 = 值班员（小模型永远在，保证有人应答）───────────────
- id: agent-default-model
  config:
    provider: guard
    model: minicpm5-2b

# ── 研究员子代理：值班员的唯一自主出口 ───────────────────────────────
# 值班员只决定"是否唤醒研究员"；模型与人格由这里钉死，它无法选别的模型。
- id: tool-subagent
  disabled: false
  config:
    provider: spawn
    toolName: researcher
    backgroundMode: continuable
    maxDepth: 0
    agentOptions:
      provider: researcher
      model: qwen3-8-27b
      maxTokens: 16384

# ── lab 工具（MCP stdio）：13 个工具注册为 mcp__lab__* ────────────────
# 注意：新增条目必须放进 insert: 块（裸 `- id:` 只用于修改已存在的条目）。
- insert:
    - id: mcp-lab
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: lab
        transport: stdio
        command: /root/vllm018-conda/bin/python3.11
        args:
          - /root/dsh-harness/mcp/lab_server.py

# ── 权限：本机无 bwrap/landlock，OS 级沙箱不可用 ─────────────────────
# 护栏改由两层承担：文件层 dsh-fs-sandbox（in-process 路径判定）
# + 命令层 guarded_bash（白名单放行 / 黑名单拒绝 / 含元字符转审批）。
- id: permission
  config:
    defaultPreset: auto-approve
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      auto-approve:
        # 必须是 danger-full-access，不能是 workspace-write。
        # 本机（内核 5.10 + glibc 2.27）既无 bubblewrap 也无 Landlock
        # （Landlock 需 5.13+），dsh-sandbox 因此无法兑现 workspace-write，
        # 会对**每一次** bash 调用硬失败：
        #   'sandbox mode "workspace-write" is requested but no sandbox backend
        #    is usable on this host; refusing to run the command unconfined.'
        # 后果是值班员陷在工具报错重试循环里（实测同一失败调用连试 4 次）。
        # dsh-sandbox 自己的诊断也建议改用它：
        #   'otherwise switch the consumer to danger-full-access.'
        # 安全性由另外两层承担，不靠 OS 沙箱：
        #   1) 审批层 —— approval: ask，安全员（dsh-approval-gate）逐次裁决
        #   2) 命令层 —— mcp__lab__guarded_bash（白名单放行/黑名单拒绝/元字符转审批）
        sandbox: danger-full-access
        approval: ask
        name: 自动审批（安全员）
        description: 安全员逐次预判沙箱越界 —— 安全自动放行，删除/凭据/远程/系统/批量五类硬风险永远转人工。
      guarded-full:
        sandbox: danger-full-access
        approval: ask
        name: 受护栏的全权访问
        description: 本机无 OS 级沙箱；写入改由 guarded_bash / lab 工具自行把关。

# ── 会话工作目录 = harness 的家（lab 只读可达）───────────────────────
- id: fs-sandbox
  config:
    cwd: /root/dsh-harness

# --- safety officer: deterministic approval policy on approval/request ---
# Model can only tighten, never loosen; internal errors fail closed to human.
- insert:
    - id: approval-gate
      name: dsh-approval-gate
      config:
        modelReview: true
        neutralThreshold: 3

# --- web search: use modsearch (keyless), disable the DeepSeek-only provider ---
# 07-技术方案.md 5.3: dsh-web-search-deepseek 只对 DeepSeek 后端有效;
# 两个本地模型(值班员/研究员)用它必然是死的,且会与 modsearch 抢 tool 名。
- id: web-search-deepseek
  disabled: true
# tool-web 在 base 里是 disabled 的,显式打开,让模型看到 web_search / web_fetch。
- id: tool-web
  disabled: false
  config:
    fetch: true
    searchTimeoutMs: 60000
