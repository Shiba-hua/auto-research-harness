; auto-research-harness · supervisord 托管
; 见 docs/08-验收与交付计划.md §6 止损
;
; 三个服务：
;   guard       值班员 MiniCPM5-2B（CPU 常驻，PRoot 内跑 llama-server）
;   researcher  研究员 Qwen3-32B-AWQ（GPU 按需 —— 与训练互斥，故 autostart=false）
;   dsh         DSH Web :18080（PRoot 内，因为 sharp/node-pty 要 glibc>=2.28）
;
; 研究员的启停必须走 GPU 仲裁：停它要 SIGTERM guest 内的 vllm 宿主 PID 并拿到显存释放凭证。

[supervisord]
logfile=/root/dsh-harness/logs/supervisord.log
pidfile=/root/dsh-harness/state/supervisord.pid
childlogdir=/root/dsh-harness/logs
loglevel=info
nodaemon=false

[unix_http_server]
file=/root/dsh-harness/state/supervisor.sock

[supervisorctl]
serverurl=unix:///root/dsh-harness/state/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface


[program:researcher]
command=/root/dsh-harness/bin/vllm-run vllm serve /models/Qwen3-32B-AWQ --served-model-name researcher --host 127.0.0.1 --port 18001 --max-model-len 40960 --gpu-memory-utilization 0.92 --enable-auto-tool-choice --tool-call-parser hermes
autostart=false
autorestart=false
startsecs=90
stopwaitsecs=120
stopsignal=TERM
stdout_logfile=/root/dsh-harness/logs/researcher.log
stderr_logfile=/root/dsh-harness/logs/researcher.err


[program:watchdog]
command=/root/dsh-harness/bin/watchdog
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=15
stdout_logfile=/root/dsh-harness/logs/watchdog.out
stderr_logfile=/root/dsh-harness/logs/watchdog.err

[group:harness]
programs=watchdog,researcher
